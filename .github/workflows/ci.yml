name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The release builds every supported platform from this script, so a
      # change that breaks one is caught on the pull request that made it
      # rather than at the tag.
      #
      # The stamp is not a release version, and release-version.sh would reject
      # it. That is the intended split: this proves the build, not a release, and
      # an archive from a pull request should not name itself something publishable.
      - name: Cross-compile the release targets
        run: ./scripts/build-release.sh v0.0.0-ci "$(mktemp -d)"

      # The guard that decides which tags may become a release is the one piece
      # of release logic that is only ever exercised by a tag, so it is checked
      # here instead.
      - name: Check the release version guard
        run: ./scripts/release-version.sh --self-test
